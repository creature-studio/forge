name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  windows:
    name: Windows x64 (check and test)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Compile all Windows targets
        run: cargo check --workspace --all-targets --locked

      - name: Verify Windows workspace path boundaries and editor load
        run: cargo test -p forge-fs --lib --locked windows_verbatim_and_standard_paths_are_equivalent_inside_workspace -- --nocapture

      - name: Ensure text installer matches released script
        shell: powershell
        run: |
          $original = (Get-FileHash -Algorithm SHA256 install.ps1).Hash
          $text = (Get-FileHash -Algorithm SHA256 web/public/install.txt).Hash
          if ($original -ne $text) { throw 'Windows text installer is not identical to install.ps1' }
          $homepage = Get-Content web/src/components/Landing.astro -Raw
          if (-not $homepage.Contains('/forge/install.txt | iex')) { throw 'Homepage still uses octet-stream installer URL' }

      - name: Test PowerShell installer (offline)
        shell: powershell
        run: .\scripts\test-install-windows.ps1

      - name: Verify Git for Windows staging and stash tests
        run: cargo test -p forge-git-cli --lib --locked

      - name: Smoke test Windows forge.exe
        shell: pwsh
        run: |
          cargo build -p forge --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows Forge build failed' }
          $version = & .\target\debug\forge.exe --version
          $workspaceVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($LASTEXITCODE -ne 0 -or $version -ne "forge $workspaceVersion") {
            throw "Windows Forge executable smoke test failed: $version"
          }
          Write-Host "OK: $version"

      - name: Run Windows workspace tests
        run: cargo test --workspace --locked -- --test-threads=4

  site:
    name: Web & SEO checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies and verify site
        working-directory: web
        run: |
          npm ci
          npm run check:site
