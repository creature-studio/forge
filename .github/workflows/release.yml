name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check tag matches workspace version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::tag $TAG does not match [workspace.package] version ${version}"
            exit 1
          fi
          echo "building ${TAG}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build forge
        run: cargo build --release --locked -p forge --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/forge" dist/forge
          tar -czf "forge-${{ matrix.target }}.tar.gz" -C dist forge
          rm -rf dist
          ls -l "forge-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.target }}
          path: forge-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check tag matches workspace version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $line = Get-Content Cargo.toml | Select-String '^version = "' | Select-Object -First 1
          if (-not $line) { throw 'Missing workspace version' }
          $version = [regex]::Match($line.Line, '^version = "([^"]+)"').Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match workspace version $version" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build Windows Forge
        run: cargo build --release --locked -p forge --target x86_64-pc-windows-msvc

      - name: Smoke test Windows release executable
        shell: pwsh
        run: |
          $version = & .\target\x86_64-pc-windows-msvc\release\forge.exe --version
          $versionLine = (Get-Content Cargo.toml | Select-String '^version = "' | Select-Object -First 1).Line
          $expected = 'forge ' + [regex]::Match($versionLine, '^version = "([^"]+)"').Groups[1].Value
          if ($LASTEXITCODE -ne 0 -or $version -ne $expected) {
            throw "Windows Release smoke test failed: expected $expected, got $version"
          }
          Write-Host "OK: $version"

      - name: Package Windows Forge
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath target/x86_64-pc-windows-msvc/release/forge.exe -DestinationPath forge-x86_64-pc-windows-msvc.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: forge-x86_64-pc-windows-msvc
          path: forge-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble assets
        run: |
          set -eu
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          (cd dist && sha256sum forge-*.tar.gz forge-*.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Forge $TAG" \
              --generate-notes \
              $prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
