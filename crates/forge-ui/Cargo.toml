[package]
name = "forge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ratatui widgets and layout for forge"

[dependencies]
forge-model = { workspace = true }
forge-theme = { workspace = true }
ratatui = { workspace = true }
tui-markdown = { workspace = true }
unicode-width = { workspace = true }
# Only the parser and Rust regex backend: no default syntax/theme bundles or C Oniguruma.
syntect = { version = "5.3", default-features = false, features = ["parsing", "yaml-load", "regex-fancy"] }
